services:
  postgres:
    image: postgres:16-alpine
    container_name: rentaleasy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rentaleasy
    ports:
      - "5432:5432"
    volumes:
      - rentaleasy_pgdata:/var/lib/postgresql/data

volumes:
  rentaleasy_pgdata:
